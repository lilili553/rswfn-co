[package]
name = "rswfn"
version = "0.1.0"
edition = "2024"
authors = ["Shi Xiaofei"]


[lib]
name = "rswfn"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.16"
ndarray-linalg = { version = "0.17.0" }
regex = "1.11.1"                                  # 正则表达式库
rayon = "1.5.1"                                   # 并行计算库
mem_dbg = "0.3.0"
rand = "0.9.1"                                    # 随机数库
log = "0.4.28"                                    # 日志库
simplelog = "0.12.2"
clap = { version = "4.0", features = ["derive"] } # 命令行工具库
memmap2 = "0.9.9"                                 # 内存映射库，将硬盘当成内存用
special = "0.11.4"
chrono = "0.4"
cached = "0.56.0"                                 # 函数级缓存库

[profile.dev]
incremental = true

[profile.release]
lto = true
opt-level = 3
strip = true      # Ensures debug symbols are removed.
codegen-units = 1
panic = "abort"   # Higher performance by disabling panic handlers.
debug = true      # 进行性能测试的时候需要打开

[features]
default = ["ban-c"]
use-c = ["ndarray-linalg/openblas-system"]
ban-c = ["ndarray-linalg/intel-mkl-static"]
