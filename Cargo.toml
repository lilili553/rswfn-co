[package]
name = "rswfn"
version = "0.1.0"
edition = "2024"
authors = ["Shi Xiaofei"]
description = "A wavefunction analysis library and command-line tool for quantum chemistry"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/qmlCoder/rswfn"
homepage = "https://github.com/qmlCoder/rswfn"
documentation = "https://docs.rs/rswfn"
keywords = ["quantum-chemistry", "wavefunction", "chemistry", "dft", "molecular"]
categories = ["science", "mathematics", "command-line-utilities"]
# Only source and metadata belong on crates.io. Large sample data, native
# libraries and development scratch files stay out of the published package.
exclude = [
    "/moles",
    "/libs",
    "/protos",
    "/docs",
    "/prompts",
    "/.cargo",
    "/.idea",
    "/.vscode",
    "/flamegraph.svg",
    "/rswfn-linux",
    "/test.png",
    "/test.py",
    "/test.txt",
    "/config.json",
    "/TODO.md",
]


[lib]
name = "rswfn"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.16"
faer = "0.24.0"
regex = "1.11.1"                                         # 正则表达式库
rayon = "1.5.1"                                          # 并行计算库
mem_dbg = "0.3.0"
rand = "0.9.1"                                           # 随机数库
log = "0.4.28"                                           # 日志库
simplelog = "0.12.2"
clap = { version = "4.0", features = ["derive"] }        # 命令行工具库
memmap2 = "0.9.9"                                        # 内存映射库，将硬盘当成内存用
special = "0.11.4"
chrono = "0.4"
cached = "0.56.0"                                        # 函数级缓存库


[profile.dev]
incremental = true

[profile.release]
lto = true
opt-level = 3
strip = true      # Ensures debug symbols are removed.
codegen-units = 1
panic = "abort"   # Higher performance by disabling panic handlers.
debug = true      # 进行性能测试的时候需要打开

[features]
default = []
use-cint = []                                 # 使用libcint
use-func = []                                 # 使用泛函库
