name: Release

# 给 Windows / Linux 编译预编译二进制，并附到 GitHub Release 上。
# 用法：把 Cargo.toml 的 version 改好并提交，然后打一个同名 tag 再 push：
#     git tag v0.1.1 && git push origin v0.1.1
# 也可以在 Actions 页面手动触发（workflow_dispatch），手动触发只构建不发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (MSVC)，产物为 rswfn.exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Linux x64 (glibc)，依赖目标机器的 glibc 版本
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux x64 (musl)，完全静态链接，几乎所有发行版都能直接跑，推荐
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Linux ARM64。仅公开仓库可免费使用该 runner，不需要可以删掉这一项
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          # 版本号：来自 tag（去掉前缀 v），手动触发时从 Cargo.toml 读取
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            crate_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
            if [ "${version}" != "${crate_version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与 Cargo.toml 里的版本 ${crate_version} 不一致"
              exit 1
            fi
          else
            version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi

          target="${{ matrix.target }}"
          stage="rswfn-${version}-${target}"
          mkdir -p "${stage}" dist

          bin="target/${target}/release/rswfn"
          if [ -f "${bin}.exe" ]; then bin="${bin}.exe"; fi
          cp "${bin}" "${stage}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${stage}/"

          case "${target}" in
            *windows*) (cd "${stage}" && 7z a "../dist/${stage}.zip" . > /dev/null) ;;
            *)         tar -czf "dist/${stage}.tar.gz" "${stage}" ;;
          esac

          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    # 只有打 tag 时才创建 Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" \
              --generate-notes
          fi
